<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}

.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}

:root[data-theme="dark"] .hero:not([style]) .btn:not(.alt){background:#0d1526;color:#eef1f7}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.sub{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px}

.sub b{font-weight:600;font-size:14.5px}
.cnt{font-size:13px;color:var(--mute);white-space:nowrap}
.q{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--brass);border-radius:16px;padding:22px 20px;margin:14px 0}
.q h3{margin:0;font-size:19px;line-height:1.5;font-weight:600}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:9px;margin:10px 0 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);transition:width .3s}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}

.opt span.k{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}

.exp{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--bg);color:var(--mute);font-size:14.5px}
.score{font-size:64px;font-weight:700;margin:0;color:var(--navy)}
label{display:block;font-size:14px;color:var(--mute);margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
dialog{border:0;border-radius:20px;padding:22px;width:min(560px,94vw);background:var(--card);color:var(--ink);max-height:92vh}
dialog::backdrop{background:rgba(5,10,25,.6)}
.item{display:flex;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;font-size:14.5px}
.item small{color:var(--mute);display:block}
.del{background:none;color:var(--bad);font-size:13px;flex:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#14213d;padding:10px 18px;border-radius:999px;font-weight:600}
:root[data-theme="dark"] .toast{color:#0d1526}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function save(){try{localStorage.setItem('cpoqml',JSON.stringify(qs))}catch(e){}}
let theme='';try{theme=localStorage.getItem('cpot')||''}catch(e){}
if(theme)document.documentElement.dataset.theme=theme;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sname=id=>(SUBJECTS.find(s=>s[0]===id)||[,id])[1];
let run=null,view='home',tm;
function head(){return `<header><div class="brand">Kerala PSC · CPO</div><div class="row"><button class="ghost" onclick="toggleTheme()">Dark mode</button>${view==='gate'?`<button class="ghost" onclick="adminLogin()">Admin</button>`:view==='login'?'':view==='admin'?`<button class="ghost" onclick="gate()">Logout</button>`:`<button class="ghost" onclick="powerOff()" aria-label="Power off" title="Power off" style="display:inline-flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></svg></button>`}</div></header>`}
function toggleTheme(){const d=document.documentElement;const dark=d.dataset.theme==='dark'||(!d.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);theme=dark?'light':'dark';d.dataset.theme=theme;try{localStorage.setItem('cpot',theme)}catch(e){}}
function home(){clearTimeout(tm);view='home';
const groups=[...new Set(SUBJECTS.map(s=>s[2]))];
$('app').innerHTML=head()+`<section class="hero"><h1>Civil Police Officer practice quiz</h1><p>Built on the plus-two level syllabus. Pick a subject, or take a mixed set of ${Math.min(10,qs.length)} questions.</p><div class="row"><button class="btn" onclick="start('all')">Start mixed quiz</button></div></section>`+
groups.map(g=>`<h2>${g}</h2><div class="grid">${SUBJECTS.filter(s=>s[2]===g).map(s=>{const n=qs.filter(q=>q.s===s[0]).length;return `<button class="sub" onclick="start('${s[0]}')" ${n?'':'disabled style="opacity:.5"'}><b>${s[1]}</b><span class="cnt">${n} Q</span></button>`}).join('')}</div>`).join('');}
function start(sub){let pool=qs.filter(q=>sub==='all'||q.s===sub);if(!pool.length)return;
pool=[...pool].sort(()=>Math.random()-.5);if(sub==='all')pool=pool.slice(0,10);run={sub,pool,i:0,score:0,done:false,ans:pool.map(()=>null)};quiz();}
function quiz(){clearTimeout(tm);view='quiz';const r=run,q=r.pool[r.i];
$('app').innerHTML=head()+`<div class="meta"><span>${sub2(r.sub)}</span><span>${r.i+1} / ${r.pool.length}</span></div><div class="bar"><i style="width:${r.i/r.pool.length*100}%"></i></div>
<div class="q"><h3>${esc(q.q)}</h3></div>`+q.o.map((o,k)=>`<button class="opt" onclick="pick(${k})"><span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')+`<div id="fb"></div><div class="row" style="margin-top:18px"><button class="ghost" onclick="back()" ${r.i?'':'disabled'}>Back</button><button class="ghost" onclick="skip()">Skip</button><button class="ghost" onclick="home()">Quit</button></div>`;if(r.ans[r.i]!==null)show(r.ans[r.i]);}
const sub2=s=>s==='all'?'Mixed quiz':sname(s);
function pick(k){if(run.ans[run.i]!==null)return;run.ans[run.i]=k;show(k);const at=run.i;clearTimeout(tm);tm=setTimeout(()=>{if(run&&view==='quiz'&&run.i===at)next()},3000);$('fb').insertAdjacentHTML('beforeend','<div class="bar" style="margin-top:12px"><i id="cd" style="width:0;transition:width 3s linear"></i></div>');requestAnimationFrame(()=>requestAnimationFrame(()=>{const c=$('cd');if(c)c.style.width='100%'}));}
function show(k){const q=run.pool[run.i];
document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('ok');else if(j===k)b.classList.add('bad')});
const last=run.i===run.pool.length-1;
$('fb').innerHTML=(q.e?`<div class="exp">${esc(q.e)}</div>`:'');}
function skip(){next()}
function back(){if(run.i>0){run.i--;quiz()}}
function next(){clearTimeout(tm);run.i++;run.done=false;if(run.i>=run.pool.length)return result();quiz();}
function result(){const r=run;r.score=r.ans.filter((a,i)=>a===r.pool[i].a).length;const p=Math.round(r.score/r.pool.length*100);
$('app').innerHTML=head()+`<section class="hero" style="background:var(--card);color:var(--ink);border:1px solid var(--line);border-bottom:6px solid var(--brass)"><p class="score">${r.score}/${r.pool.length}</p><h1>${p>=70?'Strong result':p>=40?'Getting there':'Keep practising'}</h1><p>${p}% correct in ${sub2(r.sub)}.${r.ans.includes(null)?' Skipped: '+r.ans.filter(a=>a===null).length+'.':''}</p><div class="row"><button class="btn" onclick="start('${r.sub}')">Retry</button><button class="btn alt" onclick="home()">All subjects</button></div></section>`;}
function addQ(){const d=$('dlg');
d.innerHTML=`<h2 style="margin-top:0;color:var(--ink);font-size:20px">Add question</h2><form method="dialog" id="f" onsubmit="return false">
<label>Subject</label><select id="fs">${SUBJECTS.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('')}</select>
<label>Question</label><textarea id="fq" rows="3"></textarea>
<div class="two">${[0,1,2,3].map(k=>`<div><label>Option ${'ABCD'[k]}</label><input id="fo${k}"></div>`).join('')}</div>
<label>Correct answer</label><select id="fa"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>
<label>Explanation (optional)</label><input id="fe">
<div class="row" style="margin-top:20px"><button class="btn" onclick="saveQ()">Save question</button><button class="ghost" onclick="$('dlg').close()">Cancel</button></div></form>`;d.showModal();}
function saveQ(){const q=$('fq').value.trim(),o=[0,1,2,3].map(k=>$('fo'+k).value.trim());
if(!q||o.some(x=>!x)){toast('Fill the question and all 4 options');return}
if(!store.length&&qs===SEED)qs=[...SEED];
qs.push({id:'u'+Date.now(),s:$('fs').value,q,o,a:+$('fa').value,e:$('fe').value.trim()});store=qs;save();$('dlg').close();toast('Question saved');if(view==='manage')manage();else home();}
function manage(){view='manage';
$('app').innerHTML=head()+`<div class="row" style="margin:14px 0"><button class="ghost" onclick="home()">Back</button><button class="btn" onclick="addQ()">Add question</button></div>`+(qs.length?qs.map(q=>`<div class="item"><div>${esc(q.q)}<small>${sname(q.s)} · answer ${'ABCD'[q.a]}</small></div><button class="del" onclick="del('${q.id}')">Delete</button></div>`).join(''):'<p>No questions yet. Add your first one.</p>');}
function del(id){qs=qs.filter(q=>q.id!==id);store=qs;save();manage();}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
function unlocked(){try{return localStorage.getItem('cpoacc')==='1'}catch(e){return false}}
function gate(){clearTimeout(tm);view='gate';
$('app').innerHTML=head()+`<section style="max-width:460px;margin:40px auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;border-bottom:6px solid var(--brass)"><h1 style="font-size:26px;line-height:1.25;margin:0 0 8px">Enter coupon code</h1><p style="margin:0 0 18px;opacity:.8">Enter your coupon code to access the Civil Police Officer practice quiz.</p><input id="cc" type="text" autocomplete="off" autocapitalize="characters" placeholder="Coupon code" onkeydown="if(event.key==='Enter')tryCode()" style="width:100%;box-sizing:border-box;padding:13px 14px;font-size:17px;letter-spacing:1px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink)"><div id="cerr" style="color:#d64545;font-size:14px;min-height:20px;margin:8px 0 6px"></div><button class="btn" style="width:100%" onclick="tryCode()">Unlock</button></section>`;
setTimeout(()=>{const e=$('cc');if(e)e.focus()},50);}
async function tryCode(){const v=(($('cc')||{}).value||'').replace(/\s+/g,'').toUpperCase();
if(!v){$('cerr').textContent='Please enter your coupon code.';return}
let ok=validCoupon(v);
if(!ok&&ONLINE){$('cerr').textContent='Checking...';
try{ok=await remoteCheck(v)}catch(e){$('cerr').textContent='Could not check the code. Please check your internet connection and try again.';return}}
if(ok){try{localStorage.setItem('cpoacc','1')}catch(e){}home();}
else $('cerr').textContent='Invalid coupon code. Please check and try again.';}
function powerOff(){clearTimeout(tm);run=null;try{localStorage.removeItem('cpoacc')}catch(e){}gate();}
const INP='width:100%;box-sizing:border-box;padding:13px 14px;font-size:17px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink)';
const CARD='max-width:460px;margin:40px auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;border-bottom:6px solid var(--brass)';
function localCoupons(){try{const a=JSON.parse(localStorage.getItem('cpocoupons')||'[]');return Array.isArray(a)?a.filter(c=>c&&typeof c.code==='string'):[]}catch(e){return[]}}
function saveCoupons(a){try{localStorage.setItem('cpocoupons',JSON.stringify(a));return true}catch(e){return false}}
const DEFAULT_CODE='CPO661';
const LOCAL_ADMIN_PW='a6un@12';
const BACKEND={url:'',key:'',adminEmail:''};
const SB=BACKEND.url.replace(/\/+$/,'');
const ONLINE=!!(SB&&BACKEND.key&&BACKEND.adminEmail);
let adminToken='';
function validCoupon(v){return (!!DEFAULT_CODE&&v===DEFAULT_CODE)||localCoupons().some(c=>c.code===v)}
function sbHeaders(tok,extra){return Object.assign({apikey:BACKEND.key,Authorization:'Bearer '+(tok||BACKEND.key),'Content-Type':'application/json'},extra||{})}
async function sbJson(r){let d=null;try{d=await r.json()}catch(e){}if(!r.ok)throw new Error((d&&(d.message||d.msg||d.error_description||d.error))||('HTTP '+r.status));return d}
async function remoteCheck(code){const r=await fetch(SB+'/rest/v1/rpc/check_coupon',{method:'POST',headers:sbHeaders(),body:JSON.stringify({c:code})});return (await sbJson(r))===true}
async function remoteLogin(pw){const r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:BACKEND.key,'Content-Type':'application/json'},body:JSON.stringify({email:BACKEND.adminEmail,password:pw})});const d=await sbJson(r);return d.access_token}
async function remoteList(){const r=await fetch(SB+'/rest/v1/coupons?select=code,created_at&order=created_at.desc',{headers:sbHeaders(adminToken)});return sbJson(r)}
async function remoteAdd(code){const r=await fetch(SB+'/rest/v1/coupons',{method:'POST',headers:sbHeaders(adminToken,{Prefer:'return=representation'}),body:JSON.stringify({code})});return sbJson(r)}
async function remoteDel(code){const r=await fetch(SB+'/rest/v1/coupons?code=eq.'+encodeURIComponent(code),{method:'DELETE',headers:sbHeaders(adminToken)});if(!r.ok)await sbJson(r)}
function expired(e){return /jwt|token/i.test(String((e&&e.message)||''))}
function backToLogin(){adminToken='';adminLogin();setTimeout(()=>{const x=$('aerr');if(x)x.textContent='Session expired. Please log in again.'},60)}
function fmtDT(iso){const d=new Date(iso);if(isNaN(d))return 'Unknown';return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+', '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true})}
function adminLogin(){clearTimeout(tm);view='login';
$('app').innerHTML=head()+`<section style="${CARD}"><h1 style="font-size:26px;line-height:1.25;margin:0 0 8px">Admin access only</h1><p style="margin:0 0 18px;opacity:.8">This section is only for the administrator.</p><input id="au" type="text" autocomplete="off" autocapitalize="off" placeholder="Username" style="${INP}"><input id="ap" type="password" autocomplete="off" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()" style="${INP};margin-top:10px"><div id="aerr" style="color:#d64545;font-size:14px;min-height:20px;margin:8px 0 6px"></div><div class="row"><button class="btn" style="flex:1" onclick="doLogin()">Login</button><button class="ghost" onclick="gate()">Back</button></div></section>`;
setTimeout(()=>{const e=$('au');if(e)e.focus()},50);}
async function doLogin(){const u=(($('au')||{}).value||'').trim(),p=($('ap')||{}).value||'';
const bad='Incorrect username or password.';
if(u!=='admin'){$('aerr').textContent=bad;return}
if(ONLINE){$('aerr').textContent='Signing in...';
try{adminToken=await remoteLogin(p)}catch(e){$('aerr').textContent=e instanceof TypeError?'Could not connect. Please check your internet connection.':bad;return}
await adminPage();return}
if(!LOCAL_ADMIN_PW){$('aerr').textContent='Admin sign-in is not set up yet.';return}
if(p===LOCAL_ADMIN_PW)adminPage();else $('aerr').textContent=bad;}
async function adminPage(msg,err){clearTimeout(tm);view='admin';
let list=[],loadErr='';
if(ONLINE){try{list=await remoteList()}catch(e){if(expired(e)){backToLogin();return}loadErr=e instanceof TypeError?'Could not connect. Please check your internet connection.':'Could not load coupon codes: '+e.message}}
else list=localCoupons().map(c=>({code:c.code,created_at:c.added})).reverse();
const row=(code,note,del)=>`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)"><div><b style="letter-spacing:1px">${esc(code)}</b><div style="font-size:13px;opacity:.75;margin-top:2px">${note}</div></div>${del}</div>`;
const rows=list.map(c=>row(c.code,'Added: '+esc(fmtDT(c.created_at)),`<button class="ghost" data-c="${esc(c.code)}" onclick="delCoupon(this.dataset.c)" aria-label="Delete coupon" title="Delete">Delete</button>`)).join('');
const total=list.length+(DEFAULT_CODE?1:0);
const foot=ONLINE?'Custom codes are shared with all users.':'Custom codes are saved in this browser only.';
const shown=msg||loadErr||'';
$('app').innerHTML=head()+`<section style="${CARD};margin-top:24px;max-width:560px"><h1 style="font-size:24px;line-height:1.25;margin:0 0 6px">Coupon codes</h1><p style="margin:0 0 16px;opacity:.8">Add a custom coupon code. Each code stores the date and time it was added.</p><div class="row"><input id="nc" type="text" autocomplete="off" autocapitalize="characters" placeholder="New coupon code" onkeydown="if(event.key==='Enter')addCoupon()" style="${INP};flex:1;min-width:0"><button class="btn" onclick="addCoupon()">Add</button></div><div style="font-size:14px;min-height:20px;margin:8px 0 14px;color:${(err||loadErr)?'#d64545':'#2e9e5b'}">${esc(shown)}</div><h2 style="font-size:16px;margin:0 0 10px">All coupon codes (${total})</h2>${rows}${DEFAULT_CODE?row(DEFAULT_CODE,'Default code (built in)',''):''}<p style="font-size:13px;opacity:.7;margin:12px 0 0">${foot}</p></section>`;
setTimeout(()=>{const e=$('nc');if(e)e.focus()},50);}
async function addCoupon(){const raw=(($('nc')||{}).value||'').replace(/\s+/g,'').toUpperCase();
if(!raw)return adminPage('Enter a coupon code.',true);
if(!/^[A-Z0-9_-]{3,20}$/.test(raw))return adminPage('Use 3 to 20 letters, numbers, hyphens or underscores.',true);
if(DEFAULT_CODE&&raw===DEFAULT_CODE)return adminPage('That coupon code already exists.',true);
if(ONLINE){try{await remoteAdd(raw)}catch(e){if(expired(e)){backToLogin();return}
return adminPage(/duplicate|already exists|23505/i.test(e.message)?'That coupon code already exists.':(e instanceof TypeError?'Could not connect. Please check your internet connection.':'Could not add the coupon: '+e.message),true)}
return adminPage('Coupon '+raw+' added for all users.')}
const a=localCoupons();if(a.some(c=>c.code===raw))return adminPage('That coupon code already exists.',true);
a.push({code:raw,added:new Date().toISOString()});
if(!saveCoupons(a))return adminPage('Could not save in this browser.',true);
adminPage('Coupon '+raw+' added.');}
async function delCoupon(code){
if(ONLINE){try{await remoteDel(code)}catch(e){if(expired(e)){backToLogin();return}
return adminPage(e instanceof TypeError?'Could not connect. Please check your internet connection.':'Could not remove the coupon: '+e.message,true)}
return adminPage('Coupon removed.')}
saveCoupons(localCoupons().filter(c=>c.code!==code));adminPage('Coupon removed.');}
if(unlocked())home();else gate();
</script>
